name: Server installer build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: macos-latest, platform: mac, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs
      - name: Prepare Linux display and sandbox helper
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Test renderer and version bridge
        if: matrix.platform != 'linux'
        run: npm run smoke
      - name: Test Linux renderer and version bridge
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum npm run smoke
      - name: Build platform installer (test signing only)
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged platform files
        run: node scripts/verify-payload.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Verify all installers and generate checksums
        run: node scripts/verify-release.mjs --assets > artifacts/SHA256SUMS.txt
      - name: Publish stable test release
        shell: bash
        run: |
          test -f "releases/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/SHA256SUMS.txt --verify-tag --draft --title "SQL Cockpit Server $RELEASE_TAG — TEST BUILD (not production-ready)" --notes-file "releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Verify public release APIs
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases" > /tmp/history.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("/tmp/latest.json")); const h=JSON.parse(fs.readFileSync("/tmp/history.json")); const expected=["win-x64.exe","mac-arm64.dmg","mac-x64.dmg","linux-x86_64.AppImage"]; if(r.tag_name!==process.env.RELEASE_TAG||r.draft||r.prerelease||!h.some(x=>x.id===r.id)||!expected.every(s=>r.assets.some(a=>a.name.endsWith(s)&&a.state==="uploaded"))) process.exit(1); console.log(r.html_url);'
